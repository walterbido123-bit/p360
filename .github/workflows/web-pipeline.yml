name: Periodismo360 Web Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after QA
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run skills:validate
      - run: npm run pipeline:plan
      - run: npm run typecheck
      - run: npm run build
        env:
          WORDPRESS_READ_URL: https://periodismo360.com
          NEXT_PUBLIC_SITE_URL: https://periodismo360.com
      - run: npm run qa
        env:
          QA_TYPECHECK_COMMAND: npm run typecheck

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
    needs: validate-and-qa
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run deploy
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
